<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文生图参考图池</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #101014; color: #ece7dd; }
  /* 吸顶区：标题 + 面包屑 */
  .sticky { position: sticky; top: 0; z-index: 40; background: rgba(16,16,20,.96); backdrop-filter: blur(6px); border-bottom: 1px solid #26262e; }
  header { padding: 14px 16px 8px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; flex: 1; }
  .topback { display: none; background: #1d1d24; color: #e8ddc4; border: 1px solid #3a3a44; border-radius: 999px; min-height: 44px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .topback.show { display: block; }
  .sub { padding: 0 16px 8px; color: #9b958a; font-size: 13px; }
  .crumbs { padding: 6px 16px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 14px; }
  .crumb { color: #cbbd93; background: none; border: none; font-size: 14px; padding: 8px 6px; min-height: 36px; cursor: pointer; }
  .crumb.cur { color: #ece7dd; font-weight: 600; cursor: default; }
  .crumbsep { color: #5c584f; padding: 0 1px; }
  /* 筛选区 */
  .filters { max-width: 1080px; margin: 0 auto; padding: 14px 16px 4px; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 9px; }
  .flabel { color: #8f8a7f; font-size: 13px; width: 38px; flex: none; padding-top: 2px; }
  .chip { border: 1px solid #33333d; background: #17171d; color: #cfc9bb; border-radius: 999px; padding: 8px 13px; font-size: 14px; min-height: 38px; cursor: pointer; }
  .chip small { color: #77736a; font-size: 11px; }
  .chip.on { background: #c8a75a; border-color: #c8a75a; color: #17130a; font-weight: 600; }
  .chip.on small { color: #5c4d22; }
  .chip.clear { border-style: dashed; color: #9b958a; }
  .cascade { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
  .cascade select { background: #17171d; color: #ece7dd; border: 1px solid #33333d; border-radius: 10px; padding: 10px; font-size: 15px; min-height: 44px; max-width: 46vw; }
  .searchrow { display: flex; gap: 8px; margin-bottom: 6px; }
  .searchrow input { flex: 1; background: #17171d; border: 1px solid #33333d; border-radius: 10px; color: #ece7dd; padding: 11px 12px; font-size: 15px; min-height: 44px; }
  main { max-width: 1080px; margin: 0 auto; padding: 6px 16px 90px; }
  .count { color: #9b958a; font-size: 14px; margin: 10px 0 12px; }
  .navcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .navcard { text-align: left; background: #17171d; border: 1px solid #2b2b34; border-radius: 14px; padding: 18px 16px; cursor: pointer; color: #ece7dd; min-height: 76px; }
  .navcard .nm { font-size: 18px; font-weight: 600; }
  .navcard .ct { color: #9b958a; font-size: 13px; margin-top: 5px; }
  .gsec { margin: 22px 0 8px; }
  .gsec h2 { font-size: 18px; font-weight: 600; }
  .gsec h2 .n { color: #8f8a7f; font-size: 13px; font-weight: 400; margin-left: 6px; }
  .gsec .gd { color: #a49e90; font-size: 13.5px; line-height: 1.65; margin-top: 5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { background: #17171d; border: 1px solid #26262e; border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: inherit; width: 100%; }
  .card .ph { aspect-ratio: 4 / 3; background: #1d1d24; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .t { padding: 9px 11px; font-size: 14px; line-height: 1.45; }
  .card .t .g { display: block; color: #8f8a7f; font-size: 12px; margin-top: 2px; }
  .empty { text-align: center; color: #9b958a; padding: 60px 0 30px; font-size: 15px; line-height: 2; }
  .empty button { background: #c8a75a; color: #17130a; border: none; border-radius: 999px; padding: 12px 26px; font-size: 15px; font-weight: 600; min-height: 44px; cursor: pointer; }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; color: #6d695f; font-size: 12px; line-height: 1.7; }
  /* 悬浮按钮组 */
  .fabs { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .fab { display: none; align-items: center; justify-content: center; min-width: 52px; min-height: 52px; padding: 12px 18px; border-radius: 999px; border: 1px solid #454552; background: rgba(29,29,36,.94); color: #ece7dd; font-size: 15px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .fab.show { display: flex; }
  .fab.gold { background: #c8a75a; color: #17130a; border-color: #c8a75a; font-weight: 600; }
  /* 筛选抽屉 */
  .drawerwrap { position: fixed; inset: 0; z-index: 70; display: none; }
  .drawerwrap.open { display: block; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .drawer { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; background: #141419; border-radius: 18px 18px 0 0; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .drawer .grip { width: 44px; height: 5px; border-radius: 3px; background: #3a3a44; margin: 4px auto 6px; }
  .drawer .dhead { display: flex; align-items: center; padding: 4px 16px 0; }
  .drawer .dhead b { font-size: 16px; flex: 1; }
  .drawer .dclose { background: #1d1d24; color: #e8ddc4; border: 1px solid #3a3a44; border-radius: 999px; min-height: 44px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  /* 详情 */
  .overlay { position: fixed; inset: 0; background: rgba(8,8,10,.97); z-index: 80; display: none; overflow-y: auto; }
  .overlay.open { display: block; }
  .ovbar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(8,8,10,.92); z-index: 5; }
  .ovbtn { background: #1d1d24; color: #e8ddc4; border: 1px solid #3a3a44; border-radius: 999px; min-height: 44px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .ovmid { max-width: 860px; margin: 0 auto; padding: 0 16px 46px; }
  .imgwrap { position: relative; }
  .imgwrap img { width: 100%; border-radius: 10px; display: block; background: #1d1d24; }
  .zone { position: absolute; top: 0; bottom: 0; width: 33.33%; background: transparent; border: none; cursor: pointer; z-index: 3; }
  .zone.l { left: 0; } .zone.r { right: 0; }
  .zone span { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; line-height: 44px; text-align: center; border-radius: 50%; background: rgba(10,10,12,.45); color: #fff; font-size: 22px; }
  .zone.l span { left: 8px; } .zone.r span { right: 8px; }
  .ovnav { display: flex; gap: 10px; margin-top: 12px; }
  .ovnav .ovbtn { flex: 1; }
  .ovmid h2 { font-size: 21px; margin: 16px 0 4px; }
  .ovmid .meta { color: #9b958a; font-size: 14px; margin-bottom: 12px; line-height: 1.6; }
  .kv { margin-bottom: 14px; }
  .kv b { display: block; color: #c8a75a; font-size: 14px; margin-bottom: 4px; }
  .kv p { font-size: 15px; line-height: 1.75; color: #ddd8cc; }
  .tagline { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .tagline span { border: 1px solid #33333d; border-radius: 999px; padding: 5px 11px; font-size: 13px; color: #b7b1a2; }
</style>
</head>
<body>
<div class="sticky">
  <header>
    <h1>文生图参考图池</h1>
    <button class="topback" id="topBack">← 返回</button>
  </header>
  <div class="sub" id="subtitle"></div>
  <nav class="crumbs" id="crumbs"></nav>
</div>

<div class="filters" id="filterSlot"><div id="filterBlock">
  <div class="cascade" id="cascade"></div>
  <div class="searchrow"><input id="q" type="search" placeholder="搜索标题、画面、风格名、来源…"></div>
  <div id="tagrows"></div>
</div></div>

<main id="main"></main>
<footer>中式美学与日系影像参考图池 · 公开只读版，仅供浏览参考。<br>图片版权归原作者所有。</footer>

<div class="fabs">
  <button class="fab" id="fabTop">↑ 回顶</button>
  <button class="fab gold" id="fabFilter">筛选</button>
  <button class="fab" id="fabBack">← 返回</button>
</div>

<div class="drawerwrap" id="drawerWrap">
  <div class="scrim" id="drawerScrim"></div>
  <div class="drawer">
    <div class="grip"></div>
    <div class="dhead"><b>筛选</b><button class="dclose" id="drawerClose">完成</button></div>
    <div id="drawerSlot"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="ovbar">
    <button class="ovbtn" id="ovBack">← 返回列表</button>
    <button class="ovbtn" id="ovPos"></button>
  </div>
  <div class="ovmid" id="ovMid"></div>
</div>

<script>
let DATA = null;
const state = { path: [], groupId: null, tags: new Set(), colors: new Set(), q: "", detail: -1, navList: [] };

const $ = s => document.querySelector(s);
const catById = id => DATA.categories.find(c => c.id === id);
const grpById = id => DATA.groups.find(g => g.id === id);
const childrenOf = id => DATA.categories.filter(c => c.parent_id === id);
const groupsOf = id => DATA.groups.filter(g => g.category_id === id);
const roots = () => DATA.categories.filter(c => c.parent_id === null);
function chainOf(catId) { const ch = []; let c = catById(catId); while (c) { ch.unshift(c.id); c = c.parent_id != null ? catById(c.parent_id) : null; } return ch; }
function refChain(r) { return chainOf(grpById(r.group_id).category_id); }
function catRefCount(catId) {
  let n = 0;
  for (const r of DATA.refs) { if (refChain(r).includes(catId)) n++; }
  return n;
}
function filtering() { return state.tags.size > 0 || state.colors.size > 0 || state.q.trim() !== ""; }
function matchRef(r) {
  if (state.groupId != null && r.group_id !== state.groupId) return false;
  if (state.path.length) { const target = state.path[state.path.length - 1]; if (!refChain(r).includes(target)) return false; }
  for (const t of state.tags) if (!r.tags.includes(t)) return false;
  for (const c of state.colors) if (!r.color_tags.includes(c)) return false;
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase(), g = grpById(r.group_id);
    const hay = [r.title, r.first_glance, r.story_point, r.style_name, r.source_text, g.name, r.tags.join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

/* ---------- 分类级联 ---------- */
function renderCascade() {
  const box = $("#cascade"); box.innerHTML = "";
  let options = roots(), depth = 0;
  while (true) {
    const sel = document.createElement("select");
    const names = ["总分类", "总类", "大风格", "分类"];
    sel.setAttribute("aria-label", names[Math.min(depth, 3)]);
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "全部" + (names[depth] || ""); sel.appendChild(o0);
    for (const c of options) { const o = document.createElement("option"); o.value = c.id; o.textContent = c.name + "（" + catRefCount(c.id) + "）"; sel.appendChild(o); }
    const cur = state.path[depth];
    sel.value = cur != null ? String(cur) : "";
    sel.dataset.depth = depth;
    sel.addEventListener("change", () => {
      const d = +sel.dataset.depth, v = sel.value;
      state.path = state.path.slice(0, d);
      if (v) state.path.push(+v);
      state.groupId = null;
      render();
      window.scrollTo({ top: 0 });
    });
    box.appendChild(sel);
    if (cur == null) break;
    const kids = childrenOf(cur);
    if (!kids.length) break;
    options = kids; depth++;
  }
  const deepest = state.path.length ? state.path[state.path.length - 1] : null;
  const gs = deepest != null ? groupsOf(deepest) : [];
  if (gs.length) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "图组");
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "全部图组"; sel.appendChild(o0);
    for (const g of gs) { const o = document.createElement("option"); o.value = g.id; o.textContent = g.name + "（" + DATA.refs.filter(r => r.group_id === g.id).length + "）"; sel.appendChild(o); }
    sel.value = state.groupId != null ? String(state.groupId) : "";
    sel.addEventListener("change", () => { state.groupId = sel.value ? +sel.value : null; render(); window.scrollTo({ top: 0 }); });
    box.appendChild(sel);
  }
}

/* ---------- 标签筛选行 ---------- */
function tagRow(label, values, counts, set) {
  const row = document.createElement("div"); row.className = "frow";
  const lb = document.createElement("span"); lb.className = "flabel"; lb.textContent = label; row.appendChild(lb);
  for (const v of values) {
    const n = counts[v] || 0; if (!n && !set.has(v)) continue;
    const b = document.createElement("button"); b.className = "chip" + (set.has(v) ? " on" : "");
    b.innerHTML = ""; b.textContent = v + " ";
    const sm = document.createElement("small"); sm.textContent = n; b.appendChild(sm);
    b.addEventListener("click", () => { set.has(v) ? set.delete(v) : set.add(v); render(); });
    row.appendChild(b);
  }
  if (set.size) {
    const c = document.createElement("button"); c.className = "chip clear"; c.textContent = "清除";
    c.addEventListener("click", () => { set.clear(); render(); });
    row.appendChild(c);
  }
  return row;
}
function renderTags() {
  const tc = {}, cc = {};
  for (const r of DATA.refs) { for (const t of r.tags) tc[t] = (tc[t] || 0) + 1; for (const c of r.color_tags) cc[c] = (cc[c] || 0) + 1; }
  const box = $("#tagrows"); box.innerHTML = "";
  box.appendChild(tagRow("题材", DATA.subject_tags, tc, state.tags));
  box.appendChild(tagRow("构图", DATA.craft_tags, tc, state.tags));
  box.appendChild(tagRow("朝代", DATA.dynasty_tags || [], tc, state.tags));
  box.appendChild(tagRow("导演", DATA.director_tags || [], tc, state.tags));
  box.appendChild(tagRow("色彩", DATA.color_names, cc, state.colors));
}

/* ---------- 面包屑 ---------- */
function renderCrumbs() {
  const box = $("#crumbs"); box.innerHTML = "";
  const items = [{ label: "全部", path: [], groupId: null }];
  state.path.forEach((cid, i) => items.push({ label: catById(cid).name, path: state.path.slice(0, i + 1), groupId: null }));
  if (state.groupId != null) items.push({ label: grpById(state.groupId).name, path: state.path.slice(), groupId: state.groupId });
  items.forEach((it, idx) => {
    if (idx) { const s = document.createElement("span"); s.className = "crumbsep"; s.textContent = "/"; box.appendChild(s); }
    const b = document.createElement("button");
    b.className = "crumb" + (idx === items.length - 1 ? " cur" : "");
    b.textContent = it.label;
    if (idx < items.length - 1) b.addEventListener("click", () => { state.path = it.path; state.groupId = it.groupId; render(); window.scrollTo({ top: 0 }); });
    box.appendChild(b);
  });
  $("#subtitle").textContent = "共 " + DATA.refs.length + " 张参考图 · 点分类逐层进入，或用筛选直接找图";
}

/* ---------- 列表 ---------- */
function cardEl(r) {
  const b = document.createElement("button"); b.className = "card";
  const ph = document.createElement("div"); ph.className = "ph";
  const img = document.createElement("img"); img.src = r.image; img.alt = r.title; img.loading = "lazy";
  ph.appendChild(img); b.appendChild(ph);
  const t = document.createElement("div"); t.className = "t"; t.textContent = r.title;
  const g = document.createElement("span"); g.className = "g"; g.textContent = grpById(r.group_id).name; t.appendChild(g);
  b.appendChild(t);
  b.addEventListener("click", () => openDetail(r.id));
  return b;
}
function navCard(label, count, onclick) {
  const b = document.createElement("button"); b.className = "navcard";
  const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = label; b.appendChild(nm);
  const ct = document.createElement("div"); ct.className = "ct"; ct.textContent = count + " 张"; b.appendChild(ct);
  b.addEventListener("click", onclick);
  return b;
}
function gridInto(container, list) {
  const grid = document.createElement("div"); grid.className = "grid";
  for (const r of list) grid.appendChild(cardEl(r));
  container.appendChild(grid);
}
function renderMain() {
  const main = $("#main"); main.innerHTML = "";
  if (filtering()) {
    const list = DATA.refs.filter(matchRef);
    state.navList = list;
    const c = document.createElement("div"); c.className = "count"; c.textContent = "筛选结果 · " + list.length + " 张"; main.appendChild(c);
    if (!list.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.appendChild(document.createTextNode("没有符合条件的图。")); e.appendChild(document.createElement("br"));
      const btn = document.createElement("button"); btn.textContent = "清除筛选";
      btn.addEventListener("click", clearFilters);
      e.appendChild(btn); main.appendChild(e);
    } else gridInto(main, list);
    return;
  }
  if (state.groupId != null) {
    const g = grpById(state.groupId);
    const list = DATA.refs.filter(r => r.group_id === g.id);
    state.navList = list;
    const sec = document.createElement("div"); sec.className = "gsec";
    const h = document.createElement("h2"); h.textContent = g.name;
    const n = document.createElement("span"); n.className = "n"; n.textContent = list.length + " 张"; h.appendChild(n); sec.appendChild(h);
    if (g.description) { const d = document.createElement("div"); d.className = "gd"; d.textContent = g.description; sec.appendChild(d); }
    main.appendChild(sec); gridInto(main, list);
    return;
  }
  const node = state.path.length ? state.path[state.path.length - 1] : null;
  const kids = node == null ? roots() : childrenOf(node);
  const navList = [];
  if (kids.length) {
    const wrap = document.createElement("div"); wrap.className = "navcards";
    for (const k of kids) wrap.appendChild(navCard(k.name, catRefCount(k.id), () => { state.path = chainOf(k.id); state.groupId = null; render(); window.scrollTo({ top: 0 }); }));
    main.appendChild(wrap);
  }
  const gs = node == null ? [] : groupsOf(node);
  for (const g of gs) {
    const list = DATA.refs.filter(r => r.group_id === g.id);
    navList.push(...list);
    const sec = document.createElement("div"); sec.className = "gsec";
    const h = document.createElement("h2"); h.textContent = g.name;
    const n = document.createElement("span"); n.className = "n"; n.textContent = list.length + " 张"; h.appendChild(n); sec.appendChild(h);
    if (g.description) { const d = document.createElement("div"); d.className = "gd"; d.textContent = g.description; sec.appendChild(d); }
    main.appendChild(sec); gridInto(main, list);
  }
  state.navList = navList;
  if (!kids.length && !gs.length) {
    const c = document.createElement("div"); c.className = "count"; c.textContent = "从上方选择一个分类开始浏览。"; main.appendChild(c);
  }
}
function clearFilters() { state.tags.clear(); state.colors.clear(); state.q = ""; $("#q").value = ""; render(); }

/* ---------- 返回 / 悬浮按钮 ---------- */
function canBack() { return $("#overlay").classList.contains("open") || state.groupId != null || state.path.length > 0 || filtering(); }
function goBack() {
  if ($("#overlay").classList.contains("open")) { closeDetail(); return; }
  if (state.groupId != null) { state.groupId = null; render(); return; }
  if (state.path.length) { state.path = state.path.slice(0, -1); render(); window.scrollTo({ top: 0 }); return; }
  if (filtering()) clearFilters();
}
function updateFabs() {
  const y = window.scrollY || 0;
  const slot = $("#filterSlot");
  const filterBottom = slot ? slot.offsetTop + slot.offsetHeight : 0;
  $("#fabFilter").classList.toggle("show", y > filterBottom && !$("#drawerWrap").classList.contains("open"));
  $("#fabTop").classList.toggle("show", y > 400);
  $("#fabBack").classList.toggle("show", canBack());
  $("#topBack").classList.toggle("show", canBack());
}
window.addEventListener("scroll", updateFabs, { passive: true });

/* ---------- 筛选抽屉 ---------- */
function openDrawer() {
  $("#drawerSlot").appendChild($("#filterBlock"));
  $("#drawerWrap").classList.add("open");
  updateFabs();
}
function closeDrawer() {
  $("#filterSlot").appendChild($("#filterBlock"));
  $("#drawerWrap").classList.remove("open");
  updateFabs();
}

/* ---------- 详情 ---------- */
function detailList() { return state.navList.length ? state.navList : DATA.refs; }
function openDetail(id) {
  const list = detailList();
  state.detail = list.findIndex(r => r.id === id);
  state.savedScroll = window.scrollY || 0;
  renderDetail();
  $("#overlay").classList.add("open");
  $("#overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  updateFabs();
}
function closeDetail() {
  $("#overlay").classList.remove("open");
  state.detail = -1;
  document.body.style.overflow = "";
  window.scrollTo({ top: state.savedScroll || 0 });
  updateFabs();
}
function step(d) {
  const list = detailList(); if (!list.length) return;
  state.detail = (state.detail + d + list.length) % list.length;
  renderDetail();
  $("#overlay").scrollTop = 0;
}
function kv(label, text) {
  if (!text) return null;
  const d = document.createElement("div"); d.className = "kv";
  const b = document.createElement("b"); b.textContent = label; d.appendChild(b);
  const p = document.createElement("p"); p.textContent = text; d.appendChild(p);
  return d;
}
function renderDetail() {
  const list = detailList(), r = list[state.detail]; if (!r) return;
  const g = grpById(r.group_id);
  const chain = chainOf(g.category_id).map(id => catById(id).name).join(" / ");
  $("#ovPos").textContent = (state.detail + 1) + " / " + list.length;
  const mid = $("#ovMid"); mid.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "imgwrap";
  const img = document.createElement("img"); img.src = r.image; img.alt = r.title; wrap.appendChild(img);
  const zl = document.createElement("button"); zl.className = "zone l"; zl.setAttribute("aria-label", "上一张");
  zl.innerHTML = "<span>‹</span>"; zl.addEventListener("click", () => step(-1)); wrap.appendChild(zl);
  const zr = document.createElement("button"); zr.className = "zone r"; zr.setAttribute("aria-label", "下一张");
  zr.innerHTML = "<span>›</span>"; zr.addEventListener("click", () => step(1)); wrap.appendChild(zr);
  let tx = null;
  wrap.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener("touchend", e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 48) step(dx < 0 ? 1 : -1);
    tx = null;
  }, { passive: true });
  mid.appendChild(wrap);
  const nav = document.createElement("div"); nav.className = "ovnav";
  const bp = document.createElement("button"); bp.className = "ovbtn"; bp.textContent = "‹ 上一张"; bp.addEventListener("click", () => step(-1));
  const bn = document.createElement("button"); bn.className = "ovbtn"; bn.textContent = "下一张 ›"; bn.addEventListener("click", () => step(1));
  nav.appendChild(bp); nav.appendChild(bn); mid.appendChild(nav);
  const h = document.createElement("h2"); h.textContent = r.title; mid.appendChild(h);
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = chain + " / " + g.name + (r.style_name ? " · " + r.style_name : "");
  mid.appendChild(meta);
  const tl = document.createElement("div"); tl.className = "tagline";
  for (const t of r.tags) { const s = document.createElement("span"); s.textContent = t; tl.appendChild(s); }
  for (const t of r.color_tags) { const s = document.createElement("span"); s.textContent = t; tl.appendChild(s); }
  mid.appendChild(tl);
  for (const node of [
    kv("一眼印象", r.first_glance), kv("画面内容", r.story_point),
    kv("构图", r.composition_note), kv("光线", r.light_note), kv("色彩", r.color_note),
    kv("可复用要点", r.reusable_note), kv("风格说明", r.style_desc), kv("来源", r.source_text)
  ]) if (node) mid.appendChild(node);
}
document.addEventListener("keydown", e => {
  if (!$("#overlay").classList.contains("open")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "Escape") closeDetail();
});

/* ---------- 启动 ---------- */
function render() { renderCascade(); renderTags(); renderCrumbs(); renderMain(); updateFabs(); }
$("#q").addEventListener("input", e => { state.q = e.target.value; renderMain(); updateFabs(); });
$("#topBack").addEventListener("click", goBack);
$("#fabBack").addEventListener("click", goBack);
$("#fabTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
$("#fabFilter").addEventListener("click", openDrawer);
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerScrim").addEventListener("click", closeDrawer);
$("#ovBack").addEventListener("click", closeDetail);
$("#ovPos").addEventListener("click", closeDetail);

fetch("data.json").then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { $("#main").innerHTML = '<div class="empty">数据加载失败，请刷新重试。</div>'; });
</script>
</body>
</html>
